<html>
    <head>
        <title>
            html table rowspan

        </title>
        <style>
            table,th,td
            {
                border: 1px solid black;
                border-collapse: collapse;
                padding: 10px;
            }
        </style>
    </head>
    <body>
        <h2> rowspan</h2>
        <table>
            <thead>
                <tr>
                    <th>male</th>
                    <th>female</th>
                    <th>non</th>
                   
                </tr>
            </thead>
            <tbody>
                <tr>
                
                    <td rowspan="2">girl</td>
                    <td>dont</td>
                    
                </tr>
                <tr>
                   
                    <td>soft</td>
                    <td>dont</td>
                   
                    
                </tr>
            </tbody>
        </table>
    </body>
</html>
