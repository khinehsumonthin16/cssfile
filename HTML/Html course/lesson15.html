<html>
    <head>
        <title>table colspan and rowspan</title>
        <style>
            table,th,td
            {
                border: 1px solid gray;
                border-collapse: collapse;
                padding: 10px;

            }
        </style>
    </head>

    <body>
        <h2>table colspan and rowspan</h2>
        <table>
            <thead>
              <tr>
                <th colspan="2">Frontend</th>
                <th colspan="2">backend</th>
                
              </tr>  
            </thead>
            <tbody>
                <tr>
                    <td>HTML</td>
                    <td>CSS</td>
                    <td>php</td>
                    <td>java</td>

                </tr>

                <tr>
                    <td>javascript</td>
                    <td>bootstrap</td>
                    <td>dart</td>
                    <td>python</td>
                </tr>


            </tbody>
        </table>

        <table>
            <thead>
                <tr>
                    <th colspan="4">web development</th>
                </tr>
              <tr>

            </thead>
            <tbody>
                <tr>
                    <td>HTML</td>

                    <td>php</td>
                    <td>java</td>

                </tr>

                <tr>
                    <td>javascript</td>
                    <td>bootstrap</td>
                    <td>dart</td>
                    <td>python</td>
                </tr>
            </tbody>
        </table>

        <hr>

        <table>
            <thead>
            
            </thead>

                <tr>
                    
                    <td colspan="2">CSS</td>
                    <td>php</td>

                 </tr>

                <tr>
                    <td>javascript</td>
                    <td>bootstrap</td>

                </tr>


            </tbody>
        </table>

    </body>
</html>
