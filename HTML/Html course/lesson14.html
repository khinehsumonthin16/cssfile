<html>
    <head>
        <title> html table</title>
        <style>

            table,td,th
            {
                border: 1px solid red;
                border-collapse: collapse;
                padding: 20px;
                text-align: center;
            }
        </style> 

    </head>
    <body>

        <h2>HTML table</h2>

        <table border="1">
            <thead>

            <tr>
                <th>number</th>
                <th>address</th>
                <th>name</th>
            </tr>

            </thead>
            
            <tbody>
                <tr>
                <td>1</td>
                <td>tamwe</td>
                <td>may may</td>
            </tr>
            <tr>
                <td>2</td>
                <td>kyoukmyoung</td>
                <td>oo oo</td>
            </tr>
            <tr>
                <td>3</td>
                <td>san choung</td>
                <td>kg kg</td>
        
            </tr>

            </tbody>
    
        </table>
    
        <br>

        <table border="1">
            <tr>
                <th>ID</th>
                <th>major</th>
                <th>batch</th>
            </tr>
            <tr>
                <td>1111</td>
                <td>CS</td>
                <td>31</td>
            </tr>
            <tr>
                <td>122</td>
                <td>IN</td>
                <td>26</td>
            </tr>
        </table>
    </body>
</html>
