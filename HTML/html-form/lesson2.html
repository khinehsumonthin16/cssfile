<!DOCTYPE html>
<html lang="en">
<head>
    <title>IT learning Hub</title>
</head>
<body>
    <h1>IT student regestration</h1>
    <small>Register to begin your IT journey</small>
    <br><br>
    <form>
        <label for="fullname">Full Name</label><br>
        <input  placeholder="enter your full name." type="text" id="fullname" required>
        <br><br>
        <label for="email">Email</label><br>
        <input type="email" id="email" placeholder="you@example.com" required>
        <br><br>
        <label for="password">Password</label><br>
        <input type="password" id="password" placeholder="Enter your password" required>
        <br><br>
        <label for="age">Age</label><br>
        <input type="number" id="age" placeholder="18-30" min="18" max="30" required>
        <br><br>
        <label for="Username">Username</label><br>
        <input type="text" id="Username" placeholder="Enter your username" maxlength="15" minlength="7" required>
        <br><br>
        <label for="date">Date of birth</label><br>
        <input type="date" id="date" required>
        <br><br>

        <label>IT Level</label><br>

<input type="radio" id="beginner"
       name="level" value="beginner" required>
<label for="beginner">Beginner</label><br>

<input type="radio" id="intermediate"
       name="level" value="intermediate">
<label for="intermediate">Intermediate</label><br>

<input type="radio" id="advanced"
       name="level" value="advanced">
<label for="advanced">Advanced</label>
        <br><br>

        <label for="country">Country</label>
        <select name="country" id="country">
            <option value="US">United state</option>
            <option value="UK">Uinted Kingdom</option>
            <option value="Ep">Europe</option>
            <option value="Ja">Japan</option>
        </select>
        <br><br>
        <label for="courses">Preferred courses</label><br>
        <select name="courses" id="courses">
            <optgroup label="Web development">
                <option value="HTML">HTML</option>
                <option value="CSS">CSS</option>
                <option value="Javascript">Javascript</option>
            </optgroup>
            <optgroup label="programming">
                <option value="python">Python</option>
                <option value="java">java</option>
                <option value="ruby">Ruby</option>
            </optgroup>
        </select>
        <br><br>
        <input type="file">
        <br><br>
        <label for="skills">Skills you want to learn</label>
        <br><br>
        <input type="checkbox" name="skills" id="skills" checked>
        <label for="skills">HTML</label>
        <br>
         <input type="checkbox" name="skills" id="skills" checked>
        <label for="skills">CSS</label>
        <br>
        <input type="checkbox" name="skills" id="skills" checked>
        <label for="skills">Javascript</label>
        <br>
         <input type="checkbox" name="skills" id="skills" checked>
        <label for="skills">python</label>
        <br><br>
        <label for="suggestions">Programming language(suggestion)</label>
        <input type="text" id="suggestions" name="suggestions" list="suggestions">

        <datalist id="suggestions">
            <option value="Python">
            <option value="Java">
            <option value="Javascript">
            <option value="C++">

        </datalist>
        <br><br>
        <LAbel for="reason">Tell me about yourself</LAbel>
        <textarea name="reason" id="reason" rows="4" cols="40"></textarea>
        <br><br>
        <button type="submit">Register</button>
        <button type="reset">Clear</button>
    </form>
</body>
</html>
